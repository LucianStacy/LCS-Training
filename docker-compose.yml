services:
  lcs-training:
    build: .
    image: lcs-training:latest
    container_name: lcs-training
    restart: unless-stopped
    ports:
      # Only reachable from this computer. Change to "8765:8765" to share on your network
      # (the app has no logins yet, so only do that on a trusted network).
      - "127.0.0.1:8765:8765"
    volumes:
      - lcs-data:/data

volumes:
  lcs-data:
